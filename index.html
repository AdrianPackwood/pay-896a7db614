<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Garage sale – pay by bank transfer</title>
<style>
  body{margin:0;font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;background:#f4f4f2;color:#111;display:flex;min-height:100vh;align-items:center;justify-content:center}
  .card{background:#fff;border-radius:16px;padding:28px 24px;max-width:420px;width:90%;box-shadow:0 2px 12px rgba(0,0,0,.08);text-align:center}
  h1{font-size:1.5rem;margin:0 0 4px}
  p.sub{margin:0 0 24px;color:#555}
  .label{font-size:.85rem;color:#666;text-transform:uppercase;letter-spacing:.05em;margin-top:18px}
  .value{font-size:1.5rem;font-weight:700;margin:4px 0 8px;word-break:break-all}
  button{font-size:1rem;padding:12px 20px;border:0;border-radius:10px;background:#111;color:#fff;width:100%;cursor:pointer}
  button.done{background:#2e7d32}
  .note{margin-top:24px;font-size:.9rem;color:#555}
</style>
</head>
<body>
<div class="card">
  <h1>Garage sale</h1>
  <p class="sub">Pay by bank transfer</p>

  <div class="label">Account name</div>
  <div class="value">Adrian Packwood</div>

  <div class="label">Account number</div>
  <div class="value" id="acct">03-0531-0121709-000</div>
  <button onclick="copyText('03-0531-0121709-000', this)">Copy account number</button>

  <div class="label">Reference</div>
  <div class="value">Garage sale</div>

  <p class="note">Please show your payment confirmation before taking your items. Thank you!</p>
</div>
<script>
function copyText(t, btn){
  function ok(){btn.textContent='Copied ✓';btn.classList.add('done');setTimeout(function(){btn.textContent='Copy account number';btn.classList.remove('done')},2000)}
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(ok,fallback)}else{fallback()}
  function fallback(){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){}document.body.removeChild(a)}
}
</script>
</body>
</html>
